<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Config Builder — CHVS</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
<header>
  <h1>⚙️ Config Builder — Gastos CHVS 2026</h1>
  <div class="actions">
    <button class="btn btn-primary" id="btn-save" onclick="saveConfig()">
      💾 Guardar config
    </button>
  </div>
</header>

<!-- ═══════════════════════════ MAIN ════════════════════════════ -->
<div class="main">

  <!-- ─────────── PANEL IZQUIERDO: hojas Excel ─────────── -->
  <div class="panel-left">
    <div class="tabs-nav" id="tabs-nav">
      <!-- pestañas generadas por JS -->
    </div>
    <div class="sheet-content" id="sheet-content">
      <!-- filas de la hoja activa -->
    </div>
  </div>

  <!-- ─────────── PANEL DERECHO: archivos fuente ─────────── -->
  <div class="panel-right">
    <div class="panel-right-header">
      📂 Archivos fuente por carpeta mensual
    </div>

    <!-- ── Subir archivos al servidor ── -->
    <div class="upload-section">
      <div class="upload-header" onclick="toggleUpload()">
        &#8593; Subir archivos al servidor <span id="upload-arrow">&#9654;</span>
      </div>
      <div class="upload-body" id="upload-body" style="display:none">
        <div class="upload-row">
          <label>Carpeta mes:</label>
          <input type="text" id="upload-folder" placeholder="Ej: ABRIL" maxlength="20"
                 style="width:90px;text-transform:uppercase">
        </div>
        <input type="file" id="upload-files" multiple accept=".xls,.xlsx"
               style="font-size:.78rem;margin:6px 0">
        <button class="btn btn-upload" id="btn-upload" onclick="uploadFiles()">
          Subir archivos
        </button>
        <div id="upload-status" style="font-size:.75rem;margin-top:4px;color:#555"></div>
      </div>
    </div>

    <div class="folder-select-wrap">
      <label>Carpeta:</label>
      <select class="folder-select" id="folder-select">
        <option value="">-- Selecciona carpeta --</option>
      </select>
    </div>

    <div class="selection-bar" id="selection-bar" style="display:none">
      <span class="sel-count"></span>
      <button class="btn-sel-clear" onclick="clearChipSelection()">✕ Limpiar selección</button>
    </div>

    <div class="accordion-wrap" id="accordion-wrap">
      <p style="padding:20px;color:#aaa;font-size:.85rem;">
        Selecciona una carpeta para ver los archivos disponibles.
      </p>
    </div>
  </div>

</div>

<!-- ═══════════════════════════ FOOTER ═══════════════════════════ -->
<div class="footer-bar">
  <label style="font-size:.83rem;font-weight:600;">Ejecutar mes:</label>
  <select id="run-folder">
    <option value="">-- Selecciona --</option>
  </select>
  <button class="btn btn-success" id="btn-run" onclick="runMes()">
    ▶ Ejecutar mes
  </button>
  <a class="btn btn-download" id="btn-download" href="/api/download/informe" download>
    &#11015; Descargar INFORME REAL
  </a>
  <label class="btn btn-replace" title="Reemplazar el INFORME REAL base en el servidor">
    &#8679; Subir INFORME base
    <input type="file" accept=".xlsx" style="display:none" onchange="subirInformeBase(this)">
  </label>
  <span class="stats" id="stats">Cargando...</span>
</div>

<!-- ═══════════════════════════ LOG ══════════════════════════════ -->
<div class="log-panel" id="log-panel"></div>

<script src="/static/app.js"></script>
</body>
</html>
